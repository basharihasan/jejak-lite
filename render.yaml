# Blueprint deploy Render (opsional) — satu web service + satu Postgres
# gratis. Bukan Docker: Render mendeteksi Ruby lewat Gemfile lalu menjalankan
# bin/render-build.sh (lihat file itu). Isi RAILS_MASTER_KEY manual di
# dashboard Render (sync: false) — jangan pernah taruh nilai aslinya di sini.
databases:
  - name: jejak-lite-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: jejak-lite
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jejak-lite-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JOB_CONCURRENCY
        value: "1"
      # Menjalankan Solid Queue di dalam proses Puma (bukan worker terpisah)
      # — satu-satunya cara jalan di plan free Render, yang cuma mengizinkan
      # satu proses web. Tanpa ini notifikasi/job latar belakang tidak
      # pernah diproses, diam-diam (lihat solid-queue-paused-two-days di
      # memori PFKV2 — kelas kegagalan yang sama).
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Wajib di production (lihat config/initializers/active_record_encryption.rb)
      # — kolom identitas pasien di ClinicalCase dienkripsi dengan kunci ini.
      # Isi manual di dashboard, hasil `bin/rails db:encryption:init`.
      - key: AR_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: AR_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      # Dipakai config.action_mailer.default_url_options — tautan di email
      # (konfirmasi akun, reset password) akan pakai domain ini. Render
      # blueprint memberi domain otomatis <service-name>.onrender.com;
      # ganti isinya di dashboard bila service-name lain atau custom domain.
      - key: APP_HOST
        value: jejak-lite.onrender.com
      # Bootstrap admin pertama saat build (lihat bin/render-build.sh).
      # Kosongkan ADMIN_PASSWORD setelah deploy pertama.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Opsional, akun & data demo (lib/tasks/demo.rake) — dijalankan
      # bin/render-build.sh saat build HANYA bila DEMO_SEED terisi (mis.
      # "1"). Isi DEMO_PASSWORD dengan sandi sendiri; tanpa itu akun demo
      # memakai password123 yang tercantum publik. Setelah mengubah
      # keduanya, jalankan deploy ulang supaya seed berjalan.
      # - key: DEMO_SEED
      #   sync: false
      # - key: DEMO_PASSWORD
      #   sync: false
      # Opsional, server email keluar (konfirmasi akun & lupa kata sandi).
      # Tanpa SMTP_ADDRESS konfirmasi email TIDAK diwajibkan dan tautan
      # "Lupa kata sandi" disembunyikan — reset kata sandi lewat admin.
      # Contoh Gmail: smtp.gmail.com / 587 / alamat Gmail / App Password.
      # - key: SMTP_ADDRESS
      #   sync: false
      # - key: SMTP_PORT
      #   sync: false
      # - key: SMTP_USER_NAME
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: MAILER_SENDER
      #   sync: false
      # Opsional, isi kalau ingin login Google aktif:
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # Opsional, isi kalau ingin notifikasi Web Push aktif:
      # - key: VAPID_PUBLIC_KEY
      #   sync: false
      # - key: VAPID_PRIVATE_KEY
      #   sync: false
      # - key: VAPID_SUBJECT
      #   sync: false
