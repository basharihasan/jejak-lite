# Varian INTERNET-FACING dengan HTTPS otomatis (Caddy + Let's Encrypt).
#
# Beda dari docker-compose.yml (LAN-only, HTTP di :3000): di sini HANYA Caddy
# yang terbuka ke internet (80/443); kontainer `web` TIDAK dipetakan ke host,
# hanya dijangkau Caddy lewat jaringan internal Compose.
#
# Prasyarat:
#   1. Domain (CADDY_DOMAIN) mengarah ke IP publik NAS — pakai DDNS myQNAPcloud.
#   2. Router meneruskan port 80 DAN 443 ke NAS (80 dibutuhkan tantangan
#      Let's Encrypt; jangan hanya 443).
#   3. .env memuat semua nilai .env.example + CADDY_DOMAIN. Set juga
#      APP_HOST = CADDY_DOMAIN (tanpa :port), mis. jejak.namananda.myqnapcloud.com
#
# Jalankan dari folder repo di NAS (SSH) — Caddyfile di-mount relatif:
#   docker compose -f docker-compose.https.yml up -d
#   docker compose -f docker-compose.https.yml exec web bin/rails db:seed   # data rujukan
#   (lalu buat admin — lihat users:create_admin / runner di NAS_DEPLOY)
#
# Catatan Container Station: alur "paste YAML" tidak menyertakan ./Caddyfile,
# jadi jalankan varian HTTPS ini lewat SSH dari direktori repo (yang memuat
# Caddyfile). Varian LAN-only (docker-compose.yml) tetap bisa lewat paste YAML.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jejak_lite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: jejak_lite_production
    volumes:
      - jejak_lite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jejak_lite -d jejak_lite_production"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ${JEJAK_IMAGE:-ghcr.io/basharihasan/jejak-lite:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Sengaja TANPA `ports:` — akses publik hanya lewat Caddy.
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?isi SECRET_KEY_BASE di .env}
      DATABASE_URL: postgresql://jejak_lite:${POSTGRES_PASSWORD}@db:5432/jejak_lite_production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      WEB_CONCURRENCY: "1"
      SOLID_QUEUE_IN_PUMA: "true"
      ASSUME_SSL: ${ASSUME_SSL:-true}
      FORCE_SSL: ${FORCE_SSL:-true}
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY:?isi di .env}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY:?isi di .env}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT:?isi di .env}
      # Domain publik — dipakai tautan email & asset_host (https://APP_HOST).
      APP_HOST: ${CADDY_DOMAIN:?isi CADDY_DOMAIN di .env}
    volumes:
      - jejak_lite_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?isi CADDY_DOMAIN di .env (mis. jejak.namananda.myqnapcloud.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  jejak_lite_pgdata:
  jejak_lite_storage:
  caddy_data:
  caddy_config:
