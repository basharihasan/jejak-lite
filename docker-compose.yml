# Deployment self-hosted (NAS QNAP/Synology, VPS, dsb.) — dua kontainer:
# Postgres + web. Image web dari GHCR (dibangun CI — lihat
# .github/workflows/docker-publish.yml). Host tidak perlu Ruby/Rails.
#
# Cara pakai (lihat NAS_DEPLOY.md):
#   1. ./script/setup-env.sh   (Linux/macOS)  atau  script\setup-env.cmd (Windows)
#   2. docker compose pull && docker compose up -d
#   3. docker compose exec web bin/rails demo:seed
#
# Podman: ganti `docker compose` → `podman-compose` (atau `podman compose`).
#
# Di QNAP Container Station: import YAML ini, isi Environment Variables
# sesuai .env.example (Station sering mengabaikan file .env terpisah).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jejak_lite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: jejak_lite_production
    volumes:
      - jejak_lite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jejak_lite -d jejak_lite_production"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ${JEJAK_IMAGE:-ghcr.io/basharihasan/jejak-lite:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      # Image self-hosted tidak memuat credentials.yml.enc — pakai SECRET_KEY_BASE.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?isi SECRET_KEY_BASE di .env (jalankan script/setup-env)}
      DATABASE_URL: postgresql://jejak_lite:${POSTGRES_PASSWORD}@db:5432/jejak_lite_production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      WEB_CONCURRENCY: "1"
      SOLID_QUEUE_IN_PUMA: "true"
      # LAN HTTP: false agar cookie Secure tidak mematahkan login (422).
      ASSUME_SSL: ${ASSUME_SSL:-false}
      FORCE_SSL: ${FORCE_SSL:-false}
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY:?isi di .env}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY:?isi di .env}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT:?isi di .env}
      APP_HOST: ${APP_HOST:-localhost:3000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    ports:
      # Host port → 3000 di dalam kontainer (Puma). Jangan ":HOST_PORT:HOST_PORT".
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - jejak_lite_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  jejak_lite_pgdata:
  jejak_lite_storage:
