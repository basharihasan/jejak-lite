# Deployment self-hosted (NAS QNAP/Synology, VPS, dsb.) — dua kontainer:
# Postgres (data sendiri, tidak keluar dari NAS) + web (image jadi dari GHCR,
# dibangun otomatis oleh .github/workflows/docker-publish.yml).
#
# Cara pakai (lihat NAS_DEPLOY.md untuk instruksi lengkap per platform):
#   1. Salin .env.example -> .env, isi semua nilainya.
#   2. docker compose up -d
#   3. Sekali saja, untuk akun demo: docker compose exec web bin/rails demo:seed
#
# Di QNAP Container Station: import file ini lewat "Create Application" ->
# tab "Create with docker-compose.yml", lalu isi variabel di bagian
# "Environment Variables" sesuai .env.example (Container Station tidak
# selalu membaca file .env terpisah saat import manual).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jejak_lite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: jejak_lite_production
    volumes:
      - jejak_lite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jejak_lite -d jejak_lite_production"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/basharihasan/jejak-lite:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?isi RAILS_MASTER_KEY di .env, lihat config/master.key}
      DATABASE_URL: postgresql://jejak_lite:${POSTGRES_PASSWORD}@db:5432/jejak_lite_production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      WEB_CONCURRENCY: "1"
      SOLID_QUEUE_IN_PUMA: "true"
      # Wajib — aplikasi menolak boot tanpa ini (identitas pasien
      # terenkripsi). Hasil `bin/rails db:encryption:init`, KHUSUS
      # deployment ini, jangan dipakai ulang di deployment lain.
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY:?isi di .env, hasil bin/rails db:encryption:init}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY:?isi di .env}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT:?isi di .env}
      # Alamat NAS Anda diakses dari jaringan (IP:port atau domain) — dipakai
      # tautan di email konfirmasi/reset password.
      APP_HOST: ${APP_HOST:-localhost:3000}
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # File yang diunggah pengguna (foto bukti kegiatan, dsb.) — di luar
      # image, bertahan lintas update image.
      - jejak_lite_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  jejak_lite_pgdata:
  jejak_lite_storage:
