name: Build & publish Docker image

# Membangun image untuk deployment self-hosted (NAS, VPS) dan mendorongnya ke
# GitHub Container Registry — pengguna tinggal `docker compose pull`, bukan
# membangun sendiri (banyak NAS terlalu lemah untuk bundle install +
# tailwindcss build). Multi-arsitektur (amd64 + arm64).
#
# Visibilitas: diusahakan PUBLIK supaya `docker compose pull` jalan tanpa
# `docker login` / PAT. Kode sumber tetap AGPL di git; lapisan image memang
# berisi .rb — sama transparan dengan clone repo. Jika langkah "Make public"
# gagal (izin token), owner harus sekali saja: GitHub → Packages →
# jejak-lite → Package settings → Change visibility → Public.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "IMPLEMENTATION_PLAN.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PACKAGE_NAME: jejak-lite

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU (emulasi arsitektur non-native untuk build arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image multi-arsitektur
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (pull tanpa login)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER="${{ github.repository_owner }}"
          PKG="${{ env.PACKAGE_NAME }}"
          # User-owned vs org-owned package endpoints differ.
          if gh api --method PUT "user/packages/container/${PKG}/visibility" -f visibility=public; then
            echo "Package visibility set to public (user)."
          elif gh api --method PUT "orgs/${OWNER}/packages/container/${PKG}/visibility" -f visibility=public; then
            echo "Package visibility set to public (org)."
          else
            echo "::warning::Could not set package public via API. Set manually: Packages → ${PKG} → Change visibility → Public"
            exit 1
          fi
