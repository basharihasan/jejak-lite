name: Build & publish Docker image

# Membangun image untuk deployment self-hosted (NAS, VPS) dan mendorongnya ke
# GitHub Container Registry — QNAP/Synology tinggal menarik image jadi,
# bukan membangun sendiri (banyak NAS terlalu lemah untuk bundle install +
# tailwindcss build). Multi-arsitektur (amd64 + arm64) supaya cocok dengan
# NAS ber-CPU Intel/AMD maupun ARM tanpa perlu tahu dulu jenisnya.
#
# Image PRIVAT (mengikuti visibilitas repo) — jangan diubah jadi publik:
# lapisan image memuat source .rb apa adanya, bukan bytecode terkompilasi.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "IMPLEMENTATION_PLAN.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU (emulasi arsitektur non-native untuk build arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image multi-arsitektur
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
